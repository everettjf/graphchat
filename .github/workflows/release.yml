name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          bun run release:validate

      - name: Build application
        run: bun run build

      - name: Build release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release

          build_target() {
            target="$1"
            platform="$2"
            executable="$3"
            folder="graphchat-${version}-${platform}"
            mkdir -p "release/${folder}"
            bun build ./scripts/graphchat.mjs --compile --target="${target}" --outfile="release/${folder}/${executable}"
            cp -R dist "release/${folder}/dist"
            cp README.md README.zh-CN.md CHANGELOG.md LICENSE "release/${folder}/"
            mkdir -p "release/${folder}/docs"
            cp docs/CORE_TESTING.md docs/GRAPHCHAT_FORMAT.md docs/PRODUCT_VALIDATION.md docs/V020_TESTING.md "release/${folder}/docs/"
            if [[ "${platform}" == windows-* ]]; then
              (cd release && zip -qr "${folder}.zip" "${folder}")
            else
              tar -C release -czf "release/${folder}.tar.gz" "${folder}"
            fi
            rm -rf "release/${folder}"
          }

          build_target bun-windows-x64-baseline windows-x64 graphchat.exe
          build_target bun-linux-x64-baseline linux-x64 graphchat
          build_target bun-linux-arm64 linux-arm64 graphchat
          build_target bun-darwin-x64 macos-x64 graphchat
          build_target bun-darwin-arm64 macos-arm64 graphchat

          npm pack --pack-destination release
          (cd release && sha256sum *.zip *.tar.gz *.tgz > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Graph Chat $RELEASE_TAG" \
              --generate-notes
          fi
