name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm

      - name: Validate npm lockfile
        run: npm ci --ignore-scripts

      - name: Validate release metadata and both lockfiles
        run: npm run release:validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release metadata and both lockfiles
        run: bun run release:validate

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify
        run: bun run test:all
